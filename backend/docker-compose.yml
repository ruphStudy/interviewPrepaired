version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interview-coach-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: interview-coach
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-coach-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/interview-coach?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRE: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      LOG_LEVEL: info
      # Local/dev-oriented example only — a real split-process deployment
      # would set this to 'false' and rely on the `worker` service below
      # instead. Left at the default ('true'/unset) here so `docker compose
      # up` keeps working unchanged out of the box.
      RUN_JOBS_IN_PROCESS: 'true'
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - mongodb
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs

  # Optional separate job-poller process (PR-OPS-4) — NOT started by default
  # (`docker compose up` without `--profile worker` skips it); only useful
  # once `backend`'s RUN_JOBS_IN_PROCESS is set to 'false'. Runs the exact
  # same image, just a different entrypoint command.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-coach-worker
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    profiles:
      - worker
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/interview-coach?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      LOG_LEVEL: info
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - mongodb
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
